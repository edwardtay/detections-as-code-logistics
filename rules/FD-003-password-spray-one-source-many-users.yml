# FD-003: Password spray: one source, many users
# ATT&CK T1110.003 | source: Okta System Log | severity: medium | owner: identity-detections | schedule: every 5 min
title: Okta sign-in failed outside the company egress
id: 072f04a1-c7d9-5e8d-948d-4193adf7fa80
name: okta_signin_failed
status: test
description: Base rule for FD-003.
author: Edward Tay
date: 2026-10-20
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: okta
  service: okta
detection:
  selection:
    eventType: user.session.start
    outcome.result: FAILURE
  filter_company_egress:
    # office NAT and VPN egress, reviewed allowlist
    client.ipAddress|cidr:
      - 192.0.2.10/32
      - 192.0.2.20/32
  condition: selection and not filter_company_egress
falsepositives:
  - Password expiry from home networks
level: low
---
title: Password spray, eight or more users failing from one IP in 30 minutes
id: e9b692ae-6a0f-5bc6-aa83-88a64ad150bf
status: test
correlation:
  type: value_count
  rules:
    - okta_signin_failed
  group-by:
    - client.ipAddress
  timespan: 30m
  condition:
    field: actor.alternateId
    gte: 8
level: medium
